services:
  - type: web
    name: proofpay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_BASE
        value: https://api-m.sandbox.paypal.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: BASE_URL
        sync: false   # set to your Render service URL, e.g. https://proofpay.onrender.com
      - key: MOCK_AI
        value: "0"
